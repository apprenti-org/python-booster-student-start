name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8 bandit pyyaml

      - name: Lint (flake8)
        run: |
          flake8 src tests --max-line-length=100 --exclude=__pycache__

      - name: Security scan (bandit)
        run: |
          bandit -r src -ll

      - name: Run tests
        run: |
          pytest -v --maxfail=1 --disable-warnings

      - name: Validate docs exist (runbook + AI log)
        run: |
          test -f docs/runbook.md
          test -f docs/ai-prompt-log.md

      - name: Fail if zero tests collected
        run: |
          python -c "import subprocess,sys; r=subprocess.run(['pytest','--collect-only'],capture_output=True,text=True); print(r.stdout); sys.exit(1 if 'collected 0 items' in r.stdout else 0)"
