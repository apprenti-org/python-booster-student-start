service:
  name: log-monitor
  environment: dev

thresholds:
  window_seconds: 120
  error_count_threshold: 3
  critical_triggers_immediately: true
  scope: global  # global | per_service

alerting:
  provider: print
  fail_open: true
  timeout_seconds: 2
  webhook_url: "https://example.invalid/webhook?token=DEMO_TOKEN"

logging:
  level: INFO
  file: "logs/service.log"
